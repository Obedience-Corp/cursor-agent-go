name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  verify:
    name: Verify with Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    container: golang:${{ matrix.go }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify tag matches changelog
        run: grep -F "## [${GITHUB_REF_NAME#v}]" CHANGELOG.md
      - name: Quality gates
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./pkg/cursor/...
          go build ./examples/...

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
