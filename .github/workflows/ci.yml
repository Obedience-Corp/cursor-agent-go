name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    container: golang:${{ matrix.go }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./pkg/cursor/...
      - name: Build examples
        run: go build ./examples/...

  cross-build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    container: golang:1.26-bookworm
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./pkg/cursor/... ./examples/...

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: "1.26"
          go-package: ./...
